<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KabarKini — Portal Berita Indonesia</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════════
       NAVBAR
  ══════════════════════════════════════════════ -->
  <nav class="site-navbar" id="mainNav">
    <div class="container-xl">
      <div class="nav-inner">
        <!-- Logo -->
        <a class="nav-logo" href="#" onclick="showHome()">
          <span class="logo-icon"><i class="bi bi-newspaper"></i></span>
          <span class="logo-text">KabarKini</span>
        </a>

        <!-- Search -->
        <div class="nav-search" id="searchWrapper">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Cari berita…" autocomplete="off" />
          <button class="search-clear" id="searchClear" style="display:none;">
            <i class="bi bi-x"></i>
          </button>
        </div>

        <!-- Right Controls -->
        <div class="nav-controls">
          <button class="dark-toggle" id="darkToggle" title="Toggle Dark Mode">
            <span class="toggle-track">
              <span class="toggle-thumb">
                <i class="bi bi-sun-fill icon-light"></i>
                <i class="bi bi-moon-fill icon-dark"></i>
              </span>
            </span>
          </button>
          <button class="nav-menu-btn d-lg-none" id="mobileSearchBtn">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <!-- Category Nav -->
      <div class="category-bar" id="categoryBar">
        <div class="cat-scroll">
          <button class="cat-btn active" data-cat="semua">
            <i class="bi bi-grid-fill"></i> Semua
          </button>
          <button class="cat-btn" data-cat="Politik">
            <i class="bi bi-building-fill"></i> Politik
          </button>
          <button class="cat-btn" data-cat="Teknologi">
            <i class="bi bi-cpu-fill"></i> Teknologi
          </button>
          <button class="cat-btn" data-cat="Olahraga">
            <i class="bi bi-trophy-fill"></i> Olahraga
          </button>
          <button class="cat-btn" data-cat="Ekonomi">
            <i class="bi bi-graph-up-arrow"></i> Ekonomi
          </button>
          <button class="cat-btn" data-cat="Hiburan">
            <i class="bi bi-stars"></i> Hiburan
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════ -->
  <main class="main-content container-xl" id="mainContent">

    <!-- ── HOME VIEW ── -->
    <div id="homeView">

      <!-- Ticker -->
      <div class="news-ticker">
        <span class="ticker-label"><i class="bi bi-broadcast-pin"></i> TERKINI</span>
        <div class="ticker-track">
          <div class="ticker-items" id="tickerItems"></div>
        </div>
      </div>

      <!-- Hero Section -->
      <section class="hero-section" id="heroSection">
        <div class="row g-4">
          <!-- Main Headline -->
          <div class="col-lg-7">
            <div class="hero-card" id="heroCard"></div>
          </div>
          <!-- Trending Sidebar -->
          <div class="col-lg-5">
            <div class="trending-panel">
              <div class="panel-header">
                <span><i class="bi bi-fire"></i> Trending Hari Ini</span>
              </div>
              <div id="trendingList"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Section Divider -->
      <div class="section-divider">
        <span class="divider-label" id="sectionLabel">Berita Terbaru</span>
        <div class="divider-line"></div>
        <span class="divider-count" id="articleCount"></span>
      </div>

      <!-- News Grid -->
      <section class="news-grid" id="newsGrid"></section>

      <!-- No Result -->
      <div class="no-result" id="noResult" style="display:none;">
        <i class="bi bi-search"></i>
        <h4>Tidak ada berita ditemukan</h4>
        <p>Coba kata kunci atau kategori lain.</p>
      </div>

    </div><!-- /homeView -->

    <!-- ── DETAIL VIEW ── -->
    <div id="detailView" style="display:none;">
      <button class="back-btn" id="backBtn">
        <i class="bi bi-arrow-left"></i> Kembali
      </button>
      <div class="detail-container" id="detailContainer"></div>
    </div>

  </main>

  <!-- ══════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="container-xl">
      <div class="footer-inner">
        <div>
          <span class="footer-logo"><i class="bi bi-newspaper"></i> KabarKini</span>
          <p class="footer-tagline">Berita Terpercaya, Terkini, Terdepan.</p>
        </div>
        <div class="footer-cats">
          <span>Politik</span><span>Teknologi</span><span>Olahraga</span>
          <span>Ekonomi</span><span>Hiburan</span>
        </div>
        <p class="footer-copy">© 2025 KabarKini. Dummy data — project demo.</p>
      </div>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
