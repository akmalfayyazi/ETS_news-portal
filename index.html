<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KabarKini - Portal Berita</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="site-navbar sticky-top">
    <div class="container">
      <div class="navbar-row">

        <!-- Logo -->
        <a class="logo" href="#" onclick="showHome(); return false;">
          <i class="bi bi-newspaper"></i> KabarKini
        </a>

        <!-- Search -->
        <div class="search-box">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Cari berita..." />
        </div>

        <!-- Dark Mode -->
        <button class="btn-darkmode" id="darkToggle" title="Toggle Dark Mode">
          <i class="bi bi-moon-fill" id="darkIcon"></i>
        </button>

      </div>

      <!-- Kategori -->
      <div class="category-bar">
        <button class="cat-btn active" data-cat="semua">
          <i class="bi bi-grid"></i> Semua
        </button>
        <button class="cat-btn" data-cat="Politik">
          <i class="bi bi-building"></i> Politik
        </button>
        <button class="cat-btn" data-cat="Teknologi">
          <i class="bi bi-cpu"></i> Teknologi
        </button>
        <button class="cat-btn" data-cat="Olahraga">
          <i class="bi bi-trophy"></i> Olahraga
        </button>
      </div>
    </div>
  </nav>

  <!-- KONTEN UTAMA -->
  <div class="container main-wrap">

    <!-- HOME VIEW -->
    <div id="homeView">

      <!-- Headline + Trending -->
      <div class="row g-4 mt-2">

        <!-- Headline Utama -->
        <div class="col-lg-7">
          <div class="section-title">
            <span class="title-bar"></span>
            <span>Headline Utama</span>
          </div>
          <div id="heroCard"></div>
        </div>

        <!-- Trending -->
        <div class="col-lg-5">
          <div class="section-title">
            <span class="title-bar"></span>
            <span>Trending Hari Ini</span>
          </div>
          <div id="trendingList"></div>
        </div>

      </div>

      <!-- Label Berita + Count -->
      <div class="list-header mt-4">
        <span id="sectionLabel" class="list-label">Berita Terbaru</span>
        <span id="articleCount" class="list-count"></span>
      </div>

      <!-- Grid Berita -->
      <div class="row g-3 mt-1" id="newsGrid"></div>

      <!-- Tidak Ada Hasil -->
      <div id="noResult" style="display:none;" class="text-center py-5">
        <i class="bi bi-search" style="font-size:2.5rem; color:#aaa;"></i>
        <p class="mt-3 text-muted">Tidak ada berita yang ditemukan.</p>
      </div>

    </div>
    <!-- end homeView -->

    <!-- DETAIL VIEW -->
    <div id="detailView" style="display:none;">
      <button class="btn-back mt-3" id="backBtn">
        <i class="bi bi-arrow-left"></i> Kembali
      </button>
      <div id="detailContainer"></div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container text-center">
      <p class="mb-1"><i class="bi bi-newspaper"></i> <strong>KabarKini</strong></p>
      <p class="mb-3"><small>Portal Berita Indonesia &mdash; 2025</small></p>
      <div class="footer-socials">
        <a href="#" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" title="X / Twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="#" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a href="#" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" title="YouTube"><i class="bi bi-youtube"></i></a>
        <a href="#" title="TikTok"><i class="bi bi-tiktok"></i></a>
      </div>
      <small class="footer-copy">© 2025 KabarKini. All rights reserved.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
